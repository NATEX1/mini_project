services:
  # 1. PHP + Apache Web Server
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=hospital_queue_db
      - DB_USER=root
      - DB_PASS=rootpassword
    depends_on:
      - db
    restart: always

  # 2. MariaDB Database (พอร์ตภายนอกใช้ 3307 เพื่อไม่ชนกับ MySQL เดิมบนเครื่อง)
  db:
    image: mariadb:10.11
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=hospital_queue_db
    volumes:
      - db_data:/var/lib/mysql
      # นำเข้า schema.sql อัตโนมัติเมื่อสร้าง container ครั้งแรก
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  # 3. phpMyAdmin (เข้าใช้งานที่ http://localhost:8080)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=rootpassword
    depends_on:
      - db
    restart: always

volumes:
  db_data:
